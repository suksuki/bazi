[pytest]
# 仓库根：core / config；legacy：ui、controllers 等；qiazhi：v17_rebirth（包名 v17_rebirth）
pythonpath = . legacy qiazhi
testpaths = legacy/tests qiazhi_bazi/backend/tests qiazhi/v17_rebirth/tests
markers =
    integration: 需要完整 FastAPI 栈或外部服务的集成测试
    regression: 面向已修复缺陷的契约/回归断言
    synthetic: 合成样盘实验室（Synthetic Lab）基线与学习回归
