<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>掐指一算 · 八字测算</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260501-portrait-options" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
  </head>
  <body>
    <main class="oracle-page agent-only-page">
      <header class="oracle-hero">
        <div class="brand compact-brand">
          <img class="brand-logo" src="/assets/qiazhi-logo-mark.png" alt="掐指一算" />
          <div>
            <div class="eyebrow">掐指一算</div>
            <h1 data-i18n="app_title"></h1>
            <p data-i18n="app_subtitle"></p>
          </div>
        </div>
        <div class="agent-top-actions">
          <a class="nav-link" href="/profiles" data-i18n="back_to_profiles"></a>
          <label class="locale-switch"><span data-i18n="locale_label"></span><select id="locale"></select></label>
        </div>
      </header>

      <section id="profileMissing" class="oracle-card hidden">
        <h2 data-i18n="select_profile_first"></h2>
        <a class="nav-link" href="/profiles" data-i18n="back_to_profiles"></a>
      </section>

      <section id="agentMain" class="hidden">
        <section class="oracle-card profile-summary-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">Chart</div>
              <h2 id="profileTitle"></h2>
            </div>
          </div>
          <div id="pillarPanel" class="pillar-panel"></div>
          <div id="portraitPanel" class="portrait-panel"></div>
        </section>

        <section class="oracle-card oracle-question-card">
          <div class="section-head">
            <div>
              <div class="section-kicker">Agent</div>
              <h2 data-i18n="question_builder"></h2>
            </div>
          </div>
          <div id="questionContext" class="question-context"></div>
          <div id="questionChips" class="oracle-chip-grid"></div>
          <div id="nextQuestionBlock" class="next-question-block hidden">
            <div class="section-head"><div><div class="section-kicker">Next</div><h2 data-i18n="next_questions"></h2></div></div>
            <div id="nextQuestions" class="oracle-chip-grid"></div>
          </div>
          <label class="message"><span data-i18n="custom_question"></span><textarea id="message"></textarea></label>
          <button id="run" type="button" data-i18n="run_analysis"></button>
          <div id="oracleStatus" class="status-line muted"></div>
        </section>

        <section id="result" class="oracle-result hidden">
          <section class="oracle-card answer-card-main">
            <div class="section-head">
              <div>
                <div class="section-kicker">Answer</div>
                <h2 data-i18n="guided_answer"></h2>
              </div>
              <div class="badge-row"><span class="badge" data-i18n="question_answer_only"></span></div>
            </div>
            <div id="questionAnswer"></div>
            <div id="answerEvidenceSummary" class="answer-evidence-summary hidden"></div>
            <div id="answerFeedback" class="question-feedback hidden"></div>
          </section>
        </section>
      </section>
    </main>
    <script src="/assets/oracle.js?v=20260501-portrait-options"></script>
  </body>
</html>
