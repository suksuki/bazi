<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V19 Profiles</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="profiles-page">
      <header class="entry-hero">
        <div class="brand compact-brand">
          <div class="mark">V19</div>
          <div>
            <div class="eyebrow">Bazi Profiles</div>
            <h1 data-i18n="profile_list"></h1>
            <p data-i18n="profile_list_desc"></p>
          </div>
        </div>
        <div class="profile-header-actions">
          <nav id="roleNav" class="role-nav" aria-label="role navigation"></nav>
          <label class="locale-switch"><span data-i18n="locale_label"></span><select id="locale"></select></label>
        </div>
      </header>

      <section id="listStep" class="profile-step active">
        <div class="profile-list-head">
          <h2 data-i18n="profile_list"></h2>
          <button id="newProfile" type="button" data-i18n="new_profile"></button>
        </div>
        <div id="profileList" class="profile-list"></div>
      </section>

      <section id="birthStep" class="profile-step">
        <div class="section-kicker">Step 1</div>
        <h2 data-i18n="birth_input"></h2>
        <label><span data-i18n="profile_name"></span><input id="profileName" placeholder="本人" /></label>
        <div class="oracle-form-grid">
          <label><span data-i18n="year"></span><select id="year"></select></label>
          <label><span data-i18n="month"></span><select id="month"></select></label>
          <label><span data-i18n="day"></span><select id="day"></select></label>
          <label><span data-i18n="hour"></span><select id="hour"></select></label>
          <label><span data-i18n="minute"></span><select id="minute"></select></label>
          <label><span data-i18n="gender"></span><select id="gender"></select></label>
          <label><span data-i18n="calendar"></span><select id="calendar"></select></label>
        </div>
        <div class="button-row">
          <button id="birthNext" type="button" data-i18n="next_step"></button>
          <button id="birthBack" type="button" class="secondary" data-i18n="back"></button>
        </div>
      </section>

      <section id="confirmStep" class="profile-step">
        <div class="section-kicker">Step 2</div>
        <h2 data-i18n="pillar_confirm_title"></h2>
        <p class="step-copy" data-i18n="pillar_confirm_desc"></p>
        <div id="confirmPillars" class="structure-tags oracle-structure-tags"></div>
        <div class="button-row">
          <button id="confirmChart" type="button" data-i18n="confirm_chart"></button>
          <button id="confirmBack" type="button" class="secondary" data-i18n="back"></button>
        </div>
      </section>

      <section id="timeStep" class="profile-step">
        <div class="section-kicker">Step 3</div>
        <h2 data-i18n="time_selection_title"></h2>
        <div id="timePreview" class="time-summary oracle-time-summary"></div>
        <label><span data-i18n="flow_year"></span><input id="flowYear" inputmode="numeric" /><input id="flowYearRange" type="range" min="1984" max="2050" /></label>
        <div class="context-warning" data-i18n="does_not_represent_prediction"></div>
        <div class="button-row">
          <button id="enterAnalysis" type="button" data-i18n="enter_analysis"></button>
          <button id="timeBack" type="button" class="secondary" data-i18n="back"></button>
        </div>
      </section>

      <div id="profileStatus" class="status-line muted"></div>
    </main>
    <script src="/assets/profiles.js"></script>
  </body>
</html>
