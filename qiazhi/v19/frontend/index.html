<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V19 Entry</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="entry-page entry-simple">
      <header class="entry-hero">
        <div class="brand compact-brand">
          <div class="mark">V19</div>
          <div>
            <div class="eyebrow">Guided Bazi Agent</div>
            <h1 data-i18n="entry_title"></h1>
            <p data-i18n="entry_subtitle"></p>
          </div>
        </div>
        <label class="locale-switch"><span data-i18n="locale_label"></span><select id="locale"></select></label>
      </header>

      <section class="entry-card guest-card entry-primary-card">
        <div class="section-kicker">Fast start</div>
        <h2 data-i18n="guest_trial"></h2>
        <p data-i18n="guest_trial_desc"></p>
        <button id="guestStart" type="button" data-i18n="guest_trial"></button>
      </section>

      <section class="entry-card entry-login-card">
        <div class="section-kicker">Account</div>
        <h2 data-i18n="login_register"></h2>
        <p data-i18n="login_register_desc"></p>
        <label><span data-i18n="username"></span><input id="loginName" autocomplete="username" placeholder="local_user" /></label>
        <label><span data-i18n="password"></span><input id="loginPassword" type="password" autocomplete="current-password" /></label>
        <div class="button-row">
          <button id="login" type="button" data-i18n="login"></button>
          <button id="register" type="button" class="secondary" data-i18n="register"></button>
        </div>
        <div class="admin-warning">Admin local development only · default password must be changed before deployment.</div>
      </section>

      <div id="entryStatus" class="status-line muted"></div>
    </main>
    <script src="/assets/entry.js"></script>
  </body>
</html>
