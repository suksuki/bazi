# V17 Rebirth production reverse proxy for dblife.com.
#
# Install example:
#   sudo cp qiazhi/v17_rebirth/deploy/nginx/dblife.com.conf /etc/nginx/sites-available/dblife.com
#   sudo ln -sf /etc/nginx/sites-available/dblife.com /etc/nginx/sites-enabled/dblife.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing contract:
#   /api/auth/       -> Next.js API route on 3001, then backend /v17/auth/*
#   /api/v17-admin/  -> Next.js API route on 3001, then backend /v17/admin/*
#   /api/v17/        -> FastAPI backend on 8017
#   /                -> Next.js frontend on 3001

server {
    listen 80;
    server_name dblife.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dblife.com;

    ssl_certificate /etc/letsencrypt/live/dblife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dblife.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/auth/ {
        proxy_pass http://127.0.0.1:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/v17-admin/ {
        proxy_pass http://127.0.0.1:3001/api/v17-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/v17/ {
        proxy_pass http://127.0.0.1:8017/api/v17/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
