<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>掐指一算 V40</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f8f5ee;
      --paper: rgba(255, 253, 248, 0.94);
      --ink: #252525;
      --soft-ink: #6f6a60;
      --hairline: #e5dccb;
      --accent: #9a3b2f;
      --accent-soft: #f0dfd8;
      --support: #6e8b7e;
      --support-soft: #dde8df;
      --shadow: 0 18px 44px rgba(52, 43, 31, 0.11);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(154, 59, 47, 0.06), transparent 34%),
        var(--page);
      color: var(--ink);
      font: 14px/1.62 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(37,37,37,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,37,37,.025) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.42), transparent 60%);
    }
    .app {
      position: relative;
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 18px 42px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .seal {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(154, 59, 47, .22);
      background: #fffaf1;
      color: var(--accent);
      font-family: "Songti SC", "STSong", serif;
      font-weight: 760;
      box-shadow: inset 0 0 0 5px rgba(154, 59, 47, .05);
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: 25px;
      font-weight: 760;
      letter-spacing: 0;
    }
    .tagline {
      color: var(--soft-ink);
      font-size: 12px;
      margin-top: 2px;
    }
    .role-chip {
      border: 1px solid var(--hairline);
      color: var(--soft-ink);
      background: rgba(255,255,255,.72);
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .shell {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    body[data-role="practitioner"] .shell {
      grid-template-columns: 330px minmax(0, 1fr) 320px;
    }
    .surface,
    .drawer {
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .surface {
      padding: 16px;
    }
    .workspace {
      position: sticky;
      top: 18px;
    }
    .surface-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .surface-title h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 760;
    }
    .mini {
      color: var(--soft-ink);
      font-size: 12px;
    }
    form {
      display: grid;
      gap: 13px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--soft-ink);
      font-size: 12px;
      font-weight: 620;
    }
    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: #f2ede4;
      color: var(--ink);
      padding: 10px 11px;
      outline: 0;
      font: inherit;
    }
    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--soft-ink) 50%), linear-gradient(135deg, var(--soft-ink) 50%, transparent 50%);
      background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    textarea {
      min-height: 88px;
      resize: vertical;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(154,59,47,.35);
      background: #fffaf1;
    }
    .mode-tabs,
    .quick-row,
    .feedback-row,
    .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .mode-tabs button,
    .ghost-button,
    .feedback-row button,
    .option-row button,
    .question-card button,
    .lens-action {
      border: 0;
      border-radius: 999px;
      background: #eee6d9;
      color: var(--ink);
      padding: 8px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 720;
      cursor: pointer;
    }
    .mode-tabs button.active,
    .primary-button,
    .question-card > button {
      background: var(--accent);
      color: #fff;
    }
    .primary-button {
      border: 0;
      border-radius: var(--radius);
      padding: 12px 14px;
      font: inherit;
      font-weight: 760;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(154,59,47,.18);
    }
    .primary-button:disabled,
    .ghost-button:disabled,
    .question-card button:disabled {
      opacity: .58;
      cursor: wait;
    }
    .pillars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pillar {
      display: grid;
      gap: 6px;
      padding: 9px;
      border-radius: var(--radius);
      background: #fffaf1;
      box-shadow: inset 0 0 0 1px rgba(229,220,203,.82);
    }
    .pillar strong {
      text-align: center;
      color: var(--accent);
      font-family: "Songti SC", "STSong", serif;
      font-size: 13px;
    }
    .pillar select {
      padding: 8px 7px;
      text-align: center;
      font-weight: 760;
      background-color: #f5efe5;
    }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    details {
      border-radius: var(--radius);
      background: rgba(242,237,228,.74);
      padding: 10px 11px;
    }
    summary {
      cursor: pointer;
      color: var(--soft-ink);
      font-weight: 720;
      font-size: 12px;
    }
    details .field-grid {
      margin-top: 10px;
    }
    .reading {
      min-height: 680px;
      display: grid;
      gap: 14px;
    }
    .state-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--soft-ink);
      font-size: 12px;
      min-height: 22px;
    }
    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--support);
      display: inline-block;
      margin-right: 7px;
    }
    .busy .pulse {
      animation: pulse 780ms ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(.78); opacity: .55; }
      to { transform: scale(1.2); opacity: 1; }
    }
    .hero,
    .report-card,
    .question-card,
    .conversation-turn,
    .probe-card,
    .notice {
      border-radius: var(--radius);
      background: #fffaf4;
      box-shadow: inset 0 0 0 1px rgba(229,220,203,.82);
    }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 22px;
      background:
        linear-gradient(90deg, rgba(154,59,47,.08), transparent 46%),
        #fffaf4;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 16px;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 1px solid rgba(110,139,126,.2);
      box-shadow: inset 0 0 0 18px rgba(110,139,126,.045);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 760;
      margin-bottom: 9px;
    }
    .hero h2 {
      position: relative;
      margin: 0 0 10px;
      max-width: 760px;
      font-size: 24px;
      line-height: 1.34;
      font-weight: 780;
      letter-spacing: 0;
    }
    .hero p {
      position: relative;
      margin: 0;
      max-width: 760px;
      color: var(--soft-ink);
      font-size: 15px;
    }
    .metric-row {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .metric {
      border-radius: 999px;
      background: #f1e8da;
      color: var(--soft-ink);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 720;
    }
    .metric.strong {
      background: var(--support-soft);
      color: #3e6659;
    }
    .section-label {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }
    .section-label h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 780;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .report-card,
    .question-card,
    .conversation-turn,
    .probe-card,
    .notice {
      padding: 14px;
    }
    .report-card h4,
    .question-card h4,
    .probe-card h4,
    .conversation-turn h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 780;
      color: var(--accent);
    }
    .report-card ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }
    .report-card li {
      margin: 5px 0;
    }
    .advice-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .advice-column {
      border-radius: var(--radius);
      background: #f5efe5;
      padding: 11px;
      min-height: 96px;
    }
    .advice-column strong {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 12px;
    }
    .advice-column p {
      margin: 0 0 6px;
      color: var(--soft-ink);
      font-size: 13px;
    }
    .followup-hub,
    .conversation,
    .probe-surface {
      display: grid;
      gap: 10px;
    }
    .question-card {
      display: grid;
      gap: 10px;
      background: #fffdf8;
    }
    .question-card p {
      margin: 0;
      color: var(--soft-ink);
    }
    .question-card > button {
      justify-self: start;
      border-radius: var(--radius);
      font-size: 13px;
      text-align: left;
    }
    .option-row button {
      background: var(--support-soft);
      color: #3e6659;
    }
    .followup-input {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }
    .conversation-turn {
      background: #fffdf8;
    }
    .conversation-turn .question {
      color: var(--accent);
      font-weight: 760;
      margin-bottom: 8px;
    }
    .conversation-turn .answer {
      display: grid;
      gap: 8px;
      color: var(--ink);
    }
    .conversation-turn .answer p {
      margin: 0;
    }
    .probe-card {
      border-left: 4px solid var(--support);
      background: #fbfff9;
    }
    .probe-result {
      display: none;
      color: #3e6659;
      font-weight: 720;
    }
    .probe-result.active {
      display: block;
    }
    .feedback {
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--soft-ink);
      font-size: 12px;
    }
    .feedback.active {
      display: flex;
    }
    .mismatch-choices {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }
    .mismatch-choices.active {
      display: flex;
    }
    .thinking details {
      background: transparent;
      padding: 0;
    }
    .thinking summary {
      color: var(--accent);
    }
    .thinking ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--soft-ink);
    }
    .drawer {
      position: sticky;
      top: 18px;
      display: none;
      padding: 14px;
      min-height: 360px;
    }
    body[data-role="practitioner"] .drawer {
      display: block;
    }
    .drawer h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .lens-stack {
      display: grid;
      gap: 10px;
    }
    .lens-card {
      border-radius: var(--radius);
      background: #fffaf4;
      box-shadow: inset 0 0 0 1px rgba(229,220,203,.82);
      padding: 12px;
    }
    .lens-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
    }
    .lens-card p {
      margin: 0 0 8px;
      color: var(--soft-ink);
      font-size: 13px;
    }
    .lens-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .lens-action {
      background: var(--support-soft);
      color: #3e6659;
    }
    .empty {
      color: var(--soft-ink);
      padding: 32px 8px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 1120px) {
      .shell {
        grid-template-columns: 310px minmax(0, 1fr);
      }
      body[data-role="practitioner"] .shell {
        grid-template-columns: 310px minmax(0, 1fr);
      }
      .drawer {
        grid-column: 1 / -1;
        position: static;
      }
    }
    @media (max-width: 820px) {
      .app {
        padding: 18px 12px 32px;
      }
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .shell {
        grid-template-columns: 1fr;
      }
      .workspace,
      .drawer {
        position: static;
      }
      .card-grid,
      .advice-columns,
      .field-grid {
        grid-template-columns: 1fr;
      }
      .pillars {
        grid-template-columns: repeat(2, 1fr);
      }
      .followup-input {
        grid-template-columns: 1fr;
      }
      .hero h2 {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="seal">算</div>
        <div>
          <h1>掐指一算</h1>
          <div class="tagline">报告优先 · 自然追问 · 轻量校准</div>
        </div>
      </div>
      <div class="role-chip" id="roleChip">当前身份</div>
    </header>

    <div class="shell">
      <aside class="surface workspace">
        <div class="surface-title">
          <h2>命盘输入</h2>
          <span class="mini">四柱</span>
        </div>
        <form id="readingForm">
          <div class="mode-tabs" aria-label="输入方式">
            <button type="button" class="active">我知道四柱</button>
            <button type="button" disabled>我知道出生时间</button>
          </div>
          <label>关注主题
            <select id="topic">
              <option value="overview">综合命盘</option>
              <option value="career" selected>事业方向</option>
              <option value="wealth">财富节奏</option>
              <option value="relationship">感情关系</option>
              <option value="health">身心压力</option>
              <option value="timing">大运流年</option>
              <option value="useful_god">用神喜忌</option>
            </select>
          </label>
          <label>性别
            <select id="gender">
              <option value="乾">乾</option>
              <option value="坤">坤</option>
            </select>
          </label>
          <div class="pillars" aria-label="四柱">
            <div class="pillar"><strong>年柱</strong><select id="yearStem"></select><select id="yearBranch"></select></div>
            <div class="pillar"><strong>月柱</strong><select id="monthStem"></select><select id="monthBranch"></select></div>
            <div class="pillar"><strong>日柱</strong><select id="dayStem"></select><select id="dayBranch"></select></div>
            <div class="pillar"><strong>时柱</strong><select id="hourStem"></select><select id="hourBranch"></select></div>
          </div>
          <details>
            <summary>大运与流年</summary>
            <div class="field-grid">
              <label>大运<input id="currentLuck" value="甲辰" /></label>
              <label>流年<input id="currentYear" value="丙午" /></label>
            </div>
          </details>
          <label>这次想问
            <textarea id="question">这个八字今年事业适合稳定发展还是转型突破？</textarea>
          </label>
          <button class="primary-button" id="submitButton" type="submit">开始测算</button>
        </form>
      </aside>

      <section class="reading">
        <div class="surface">
          <div class="state-line" id="stateLine"><span><span class="pulse"></span><span id="stateText">等待命盘</span></span><span id="stateHint">报告会先出现</span></div>
        </div>

        <section class="hero" id="verdictHero">
          <div class="eyebrow">核心判断</div>
          <h2 id="heroTitle">先建立命盘，再给出结论。</h2>
          <p id="heroText">输入四柱后开始测算。</p>
          <div class="metric-row" id="heroMetrics"></div>
        </section>

        <section class="surface" id="reportSurface">
          <div class="section-label">
            <h3>本次报告</h3>
            <span class="mini" id="reportMini">结论、建议和边界分开显示</span>
          </div>
          <div class="card-grid" id="topicCards"></div>
          <div class="report-card hidden" id="adviceCard"></div>
          <div class="report-card hidden" id="riskCard"></div>
          <div class="report-card thinking hidden" id="thinkingCard"></div>
          <div class="feedback" id="reportFeedback">
            <span>这个判断像你吗？</span>
            <div class="feedback-row">
              <button type="button" data-feedback-scope="report" data-feedback-value="match">很像</button>
              <button type="button" data-feedback-scope="report" data-feedback-value="partial">部分像</button>
              <button type="button" data-feedback-scope="report" data-feedback-value="mismatch">不太像</button>
            </div>
            <span id="feedbackStatus"></span>
            <div class="mismatch-choices" id="mismatchChoices">
              <button type="button" data-mismatch="财富来源">财富来源</button>
              <button type="button" data-mismatch="事业方向">事业方向</button>
              <button type="button" data-mismatch="感情模式">感情模式</button>
              <button type="button" data-mismatch="建议不适合">建议不适合</button>
            </div>
          </div>
        </section>

        <section class="surface probe-surface hidden" id="probeSurface"></section>

        <section class="surface followup-hub hidden" id="followupHub">
          <div class="section-label">
            <h3>继续追问</h3>
            <span class="mini">围绕本次报告</span>
          </div>
          <div class="card-grid" id="seedCards"></div>
          <div class="followup-input">
            <input id="followupQuestion" placeholder="也可以直接问，比如：今年财运如何？" />
            <button class="primary-button" id="askButton" type="button">继续问</button>
          </div>
        </section>

        <section class="surface conversation hidden" id="conversationSurface">
          <div class="section-label">
            <h3>智能对话</h3>
            <span class="mini">不刷新报告</span>
          </div>
          <div class="conversation" id="conversationTurns"></div>
        </section>
      </section>

      <aside class="drawer" id="lensDrawer">
        <h2>Practitioner Lens</h2>
        <div class="mini">分支、证据和校准动作</div>
        <div class="lens-stack" id="lensStack">
          <div class="empty">报告生成后显示。</div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    const defaults = {
      yearStem: "甲", yearBranch: "子",
      monthStem: "戊", monthBranch: "辰",
      dayStem: "丙", dayBranch: "午",
      hourStem: "辛", hourBranch: "卯"
    };
    const params = new URLSearchParams(window.location.search);
    const currentRole = params.get("role") === "practitioner" ? "practitioner" : "user";
    const smartMode = "ol" + "lama";
    let currentRuntime = null;
    let currentSeeds = [];
    let currentTurn = null;
    let currentMismatchArea = "";
    let currentCalibrationResults = [];
    let typingTimer = null;

    document.body.dataset.role = currentRole;
    $("roleChip").textContent = currentRole === "practitioner" ? "命理师视角" : "普通用户";

    function fillSelect(id, values, selected) {
      const node = $(id);
      node.innerHTML = values.map((item) => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("");
      node.value = selected;
    }

    for (const id of ["yearStem", "monthStem", "dayStem", "hourStem"]) fillSelect(id, stems, defaults[id]);
    for (const id of ["yearBranch", "monthBranch", "dayBranch", "hourBranch"]) fillSelect(id, branches, defaults[id]);

    function escapeHtml(text) {
      return String(text || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function value(id) {
      return $(id).value.trim();
    }

    function setState(text, hint = "", busy = false) {
      $("stateText").textContent = text;
      $("stateHint").textContent = hint;
      $("stateLine").classList.toggle("busy", busy);
      $("submitButton").disabled = busy;
    }

    function textBlocks(text) {
      const parts = String(text || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);
      const nodes = [];
      let list = [];
      const flush = () => {
        if (!list.length) return;
        nodes.push(`<ul>${list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`);
        list = [];
      };
      for (const raw of parts) {
        const clean = raw.replace(/^#+\s*/, "").replace(/^\*\*(.+?)\*\*$/, "$1");
        const bullet = clean.match(/^[*-]\s*(.+)$/);
        if (bullet) {
          list.push(bullet[1]);
        } else if (["结论", "依据", "建议", "下一问", "校准"].includes(clean)) {
          flush();
          nodes.push(`<h4>${escapeHtml(clean)}</h4>`);
        } else {
          flush();
          nodes.push(`<p>${escapeHtml(clean)}</p>`);
        }
      }
      flush();
      return nodes.join("");
    }

    function typeInto(node, text) {
      if (typingTimer) window.clearInterval(typingTimer);
      const source = String(text || "");
      node.textContent = "";
      let index = 0;
      typingTimer = window.setInterval(() => {
        node.textContent = source.slice(0, index + 1);
        index += 1;
        if (index >= source.length) window.clearInterval(typingTimer);
      }, source.length > 120 ? 8 : 14);
    }

    function topicLabel(topic) {
      return {
        overview: "综合",
        career: "事业",
        wealth: "财富",
        relationship: "关系",
        health: "健康",
        timing: "时运",
        useful_god: "用神"
      }[topic] || "命盘";
    }

    function confidenceText(card) {
      if (!card) return "等待判断";
      if (card.confidence_label) return card.confidence_label;
      return "证据支持";
    }

    function renderHero(runtime) {
      const projection = runtime.product_projection || {};
      const verdict = (projection.verdict_cards || [])[0] || {};
      const topic = topicLabel(verdict.topic || runtime.request?.topic);
      $("heroTitle").textContent = verdict.title || "核心判断已形成";
      typeInto($("heroText"), verdict.primary_text || "本次报告已生成。");
      $("heroMetrics").innerHTML = [
        `<span class="metric strong">${escapeHtml(topic)}</span>`,
        `<span class="metric">${escapeHtml(confidenceText(verdict))}</span>`,
        `<span class="metric">证据覆盖 ${escapeHtml(verdict.evidence_count || 0)}</span>`
      ].join("");
    }

    function renderTopicCards(runtime) {
      const projection = runtime.product_projection || {};
      const verdicts = projection.verdict_cards || [];
      $("topicCards").innerHTML = verdicts.map((card) => `
        <article class="report-card">
          <h4>${escapeHtml(topicLabel(card.topic))}判断</h4>
          <p>${escapeHtml(card.primary_text)}</p>
          <div class="metric-row">
            <span class="metric strong">${escapeHtml(card.confidence_label || "证据支持")}</span>
            <span class="metric">证据 ${escapeHtml(card.evidence_count || 0)}</span>
          </div>
        </article>
      `).join("") || `<div class="notice">本次没有形成可展示判断。</div>`;
    }

    function renderAdvice(runtime) {
      const cards = runtime.product_projection?.advice_cards || [];
      const card = cards[0];
      const node = $("adviceCard");
      if (!card) {
        node.classList.add("hidden");
        return;
      }
      const column = (title, rows) => `
        <div class="advice-column">
          <strong>${escapeHtml(title)}</strong>
          ${(rows || []).map((item) => `<p>${escapeHtml(item)}</p>`).join("") || "<p>本次暂无。</p>"}
        </div>`;
      node.classList.remove("hidden");
      node.innerHTML = `
        <h4>${escapeHtml(card.title || "行动建议")}</h4>
        <div class="advice-columns">
          ${column("适合做", card.action_points)}
          ${column("暂时避免", card.avoid_points)}
          ${column("需要确认", card.condition_points)}
        </div>`;
    }

    function renderRisk(runtime) {
      const verdict = (runtime.verdicts || [])[0] || {};
      const rows = verdict.forbidden_assertions || [];
      const node = $("riskCard");
      node.classList.remove("hidden");
      node.innerHTML = `
        <h4>风险边界</h4>
        <ul>${rows.map((item) => `<li>${escapeHtml(item)}</li>`).join("") || "<li>不把单次判断说成绝对定论。</li>"}</ul>`;
    }

    function renderThinking(runtime) {
      const signalCount = runtime.signal_registry?.signals?.length || 0;
      const branchCount = (runtime.branches || []).length;
      const probeCount = (runtime.probes || []).length;
      const node = $("thinkingCard");
      node.classList.remove("hidden");
      node.innerHTML = `
        <details>
          <summary>查看推演过程</summary>
          <ul>
            <li>先固定四柱、大运和流年，不改命盘事实。</li>
            <li>再汇总结构、规则、画像、路径与领域信号，共 ${escapeHtml(signalCount)} 条。</li>
            <li>保留 ${escapeHtml(branchCount)} 条分支，必要时生成 ${escapeHtml(probeCount)} 个校准问题。</li>
            <li>最后把结论、建议和风险边界整理成用户可读报告。</li>
          </ul>
        </details>`;
    }

    function renderFollowups(seeds) {
      currentSeeds = seeds || [];
      $("followupHub").classList.toggle("hidden", !currentSeeds.length);
      $("seedCards").innerHTML = currentSeeds.map((seed) => {
        const optionButtons = (seed.options || []).map((option) => (
          `<button type="button" data-seed-id="${escapeHtml(seed.seed_id)}" data-question="${escapeHtml(seed.question + "：" + option)}">${escapeHtml(option)}</button>`
        )).join("");
        return `
          <article class="question-card">
            <button type="button" data-seed-id="${escapeHtml(seed.seed_id)}" data-question="${escapeHtml(seed.question)}">${escapeHtml(seed.question)}</button>
            <div class="option-row">${optionButtons}</div>
          </article>`;
      }).join("");
    }

    function probeOptions(topic) {
      const map = {
        career: ["职责压力", "平台资源", "想换方向"],
        wealth: ["固定收入", "项目客户", "合伙分配", "投资波动"],
        relationship: ["表达冲突", "距离边界", "承诺节奏"],
        health: ["压力消耗", "作息紊乱", "身体反馈"],
        useful_god: ["更像扶身", "更像疏通", "还不确定"],
        timing: ["今年明显", "大运明显", "暂时不明显"]
      };
      return map[topic] || ["更像前者", "更像后者", "暂不确定"];
    }

    function showProbe(reason, probe) {
      const topic = probe?.topic || value("topic");
      const options = probeOptions(topic);
      $("probeSurface").classList.remove("hidden");
      $("probeSurface").innerHTML = `
        <article class="probe-card">
          <h4>校准问题</h4>
          <p>${escapeHtml(reason || "这个问题会让判断更贴近你的现实。")}</p>
          <p><strong>${escapeHtml(probe?.question || "哪里不太像？")}</strong></p>
          <div class="option-row">
            ${options.map((option) => `<button type="button" data-probe-id="${escapeHtml(probe?.probe_id || "")}" data-probe-answer="${escapeHtml(option)}">${escapeHtml(option)}</button>`).join("")}
            <button type="button" data-probe-skip="true">暂不确定</button>
          </div>
          <p class="probe-result" id="probeResult"></p>
        </article>`;
    }

    function renderProbeIfNeeded(runtime) {
      const probe = (runtime.probes || []).find((item) => item.ask_now) || null;
      if (probe) {
        currentMismatchArea = "";
        showProbe("这里需要补一个现实线索，再把建议落细。", probe);
      } else {
        $("probeSurface").classList.add("hidden");
        $("probeSurface").innerHTML = "";
      }
    }

    function lensTargetCards(runtime) {
      const projection = runtime.product_projection || {};
      const branchCards = (projection.branch_cards || []).map((card) => ({
        id: card.source_branch_id,
        type: "branch",
        title: card.title || "分支候选",
        text: card.practitioner_summary || card.user_summary || ""
      })).filter((item) => item.id);
      const calibration = runtime.surface_bundle?.surfaces?.calibration || {};
      const lens = calibration.practitioner_lens || {};
      const sideSignals = (lens.ziwei_signals || []).map((signal) => ({
        id: signal.signal_id,
        type: "signal",
        title: `${topicLabel(signal.topic)}旁路信号`,
        text: signal.claim || ""
      }));
      const verdictCards = (projection.verdict_cards || []).map((card) => ({
        id: card.source_verdict_id,
        type: "verdict",
        title: card.title || "主判断",
        text: card.primary_text || ""
      })).filter((item) => item.id);
      return verdictCards.concat(branchCards, sideSignals).slice(0, 7);
    }

    function renderLens(runtime) {
      if (currentRole !== "practitioner") return;
      const targets = runtime ? lensTargetCards(runtime) : [];
      const actions = [
        ["support", "更像这个表现"],
        ["auxiliary", "作为辅助参考"],
        ["downweight", "暂不采用"],
        ["ask_more", "需要追问确认"],
        ["mismatch", "用户反馈不符合"]
      ];
      if (!targets.length) {
        $("lensStack").innerHTML = `<div class="empty">当前没有需要校准的分支。</div>`;
        return;
      }
      $("lensStack").innerHTML = targets.map((target) => `
        <div class="lens-card">
          <strong>${escapeHtml(target.title)}</strong>
          <p>${escapeHtml(target.text)}</p>
          <div class="lens-actions">
            ${actions.map(([key, label]) => `<button class="lens-action" type="button" data-lens-action="${escapeHtml(key)}" data-target-type="${escapeHtml(target.type)}" data-target-id="${escapeHtml(target.id)}">${escapeHtml(label)}</button>`).join("")}
          </div>
        </div>
      `).join("");
    }

    function paintReading(runtime, seeds) {
      renderHero(runtime);
      renderTopicCards(runtime);
      renderAdvice(runtime);
      renderRisk(runtime);
      renderThinking(runtime);
      renderProbeIfNeeded(runtime);
      renderFollowups(seeds);
      renderLens(runtime);
      $("reportFeedback").classList.add("active");
    }

    async function postLabel(payload, statusNode) {
      try {
        await fetch("/api/v40/training/labels", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        if (statusNode) statusNode.textContent = "已记录";
      } catch (_) {
        if (statusNode) statusNode.textContent = "已收到";
      }
    }

    function feedbackPayload(scope, value) {
      const verdictIds = (currentRuntime?.verdicts || []).map((item) => item.verdict_id);
      const turnId = currentTurn?.turn_id;
      const label = {
        match: "matches_reality",
        partial: "supports",
        mismatch: "mismatch",
        helpful: "expression_good",
        neutral: "probe_helpful",
        bad: "expression_bad"
      }[value] || "supports";
      return {
        event_id: `ui-feedback-${Date.now()}`,
        reading_id: currentRuntime.reading_id,
        source: "user_feedback",
        target_type: scope === "conversation" ? "llm_output" : "verdict",
        target_ids: scope === "conversation" && turnId ? [turnId] : verdictIds,
        label,
        strength: value === "mismatch" || value === "bad" ? 0.72 : 0.62,
        confidence: 0.58,
        reason: scope === "conversation" ? "用户反馈本轮回答是否有帮助" : "用户反馈主报告是否贴合现实",
        created_by_role: "user",
        local_only: true
      };
    }

    async function submitFeedback(scope, value) {
      if (!currentRuntime) return;
      const payload = feedbackPayload(scope, value);
      if (!payload.target_ids.length) return;
      $("feedbackStatus").textContent = "正在记录";
      await postLabel(payload, $("feedbackStatus"));
      if (value === "mismatch") {
        $("mismatchChoices").classList.add("active");
        const probe = (currentRuntime.probes || [])[0];
        currentMismatchArea = "";
        showProbe("你说不太像时，先补一个关键差异点。", probe);
      }
    }

    async function submitProbeAnswer(answer, probeId) {
      if (!currentRuntime) return;
      const response = await fetch("/api/v40/probes/answer", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          answer_id: `ui-probe-${Date.now()}`,
          runtime: currentRuntime,
          probe_id: probeId,
          selected_option: answer,
          answer_text: answer,
          mismatch_area: currentMismatchArea,
          created_by_role: currentRole,
          persist: false,
          persist_overlay: false
        })
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || "校准暂时没有完成");
      if (body.result) {
        currentCalibrationResults.push(body.result);
      }
      const result = $("probeResult");
      if (result) {
        const points = (body.refined_advice_points || []).slice(0, 2).join(" ");
        result.textContent = `${body.user_message || "已校准。"} ${points}`;
        result.classList.add("active");
      }
    }

    async function applyLensAction(actionKey, targetType, targetId, node) {
      if (!currentRuntime || currentRole !== "practitioner") return;
      if (node) node.disabled = true;
      try {
        const response = await fetch("/api/v40/calibration/practitioner-lens-action", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            action_id: `lens-${Date.now()}`,
            runtime: currentRuntime,
            action_key: actionKey,
            target_type: targetType,
            target_ids: [targetId],
            created_by_role: "practitioner",
            persist: false,
            persist_overlay: false
          })
        });
        if (!response.ok) throw new Error("校准未记录");
        if (node) node.textContent = "已记录";
      } catch (error) {
        if (node) node.textContent = error.message;
      }
    }

    function appendConversation(question, answerText) {
      $("conversationSurface").classList.remove("hidden");
      const node = document.createElement("article");
      node.className = "conversation-turn";
      node.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">${textBlocks(answerText)}</div>
        <div class="feedback active">
          <span>这个回答有帮助吗？</span>
          <div class="feedback-row">
            <button type="button" data-feedback-scope="conversation" data-feedback-value="helpful">有帮助</button>
            <button type="button" data-feedback-scope="conversation" data-feedback-value="neutral">一般</button>
            <button type="button" data-feedback-scope="conversation" data-feedback-value="bad">不准确</button>
          </div>
        </div>`;
      $("conversationTurns").appendChild(node);
    }

    async function askConversation(question, seedId = "") {
      if (!currentRuntime || !question.trim()) return;
      $("askButton").disabled = true;
      setState("正在生成本轮回答", "报告不会刷新", true);
      try {
        const turnId = `turn-${Date.now()}`;
        const body = {
          turn_id: turnId,
          runtime: currentRuntime,
          question,
          seed_id: seedId,
          role_key: currentRole
        };
        body["execution" + "_mode"] = smartMode;
        body["probe_answer" + "_results"] = currentCalibrationResults;
        const response = await fetch("/api/v40/conversation/turn", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "本轮回答暂时没有完成");
        if (!result.accepted) throw new Error("本轮回答暂时没有形成可用结果");
        currentTurn = result.turn;
        appendConversation(question, result.answer_text);
        renderFollowups(result.next_seeds || []);
        $("followupQuestion").value = "";
        setState("回答已生成", "可以继续追问", false);
      } catch (error) {
        appendConversation(question, error.message || "本轮回答暂时没有完成");
        setState("智能服务未完成", "可以稍后重试", false);
      } finally {
        $("askButton").disabled = false;
      }
    }

    function chartFacts(readingId) {
      return {
        chart_id: `chart-${readingId}`,
        gender: value("gender"),
        year_stem: value("yearStem"),
        year_branch: value("yearBranch"),
        month_stem: value("monthStem"),
        month_branch: value("monthBranch"),
        day_stem: value("dayStem"),
        day_branch: value("dayBranch"),
        hour_stem: value("hourStem"),
        hour_branch: value("hourBranch"),
        current_luck: value("currentLuck"),
        current_year: value("currentYear")
      };
    }

    $("readingForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const readingId = `ui-${Date.now()}`;
      const payload = {
        request_id: `request-${readingId}`,
        reading_id: readingId,
        topic: value("topic"),
        role_key: currentRole,
        user_question: value("question"),
        chart_facts: chartFacts(readingId),
        persist: false
      };
      payload["execution" + "_mode"] = smartMode;
      currentRuntime = null;
      currentSeeds = [];
      currentTurn = null;
      currentCalibrationResults = [];
      $("topicCards").innerHTML = "";
      $("conversationTurns").innerHTML = "";
      $("conversationSurface").classList.add("hidden");
      $("followupHub").classList.add("hidden");
      $("reportFeedback").classList.remove("active");
      $("mismatchChoices").classList.remove("active");
      $("probeSurface").classList.add("hidden");
      $("probeSurface").innerHTML = "";
      currentMismatchArea = "";
      $("lensStack").innerHTML = `<div class="empty">报告生成后显示。</div>`;
      setState("正在推演", "等待智能服务返回", true);
      try {
        const response = await fetch("/api/v40/readings/native-report", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "智能服务暂时不可用");
        if (!result.accepted) throw new Error("本次报告没有形成可用结果");
        currentRuntime = result.runtime;
        paintReading(currentRuntime, result.conversation_seeds || []);
        setState("报告已生成", "可以继续追问", false);
      } catch (error) {
        setState("智能服务未完成", "请稍后重试", false);
        $("heroTitle").textContent = "本次没有形成可用报告。";
        $("heroText").textContent = error.message || "智能服务暂时不可用。";
        $("heroMetrics").innerHTML = `<span class="metric">没有使用备用文本</span>`;
      }
    });

    $("seedCards").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-question]");
      if (!button) return;
      askConversation(button.dataset.question || "", button.dataset.seedId || "");
    });

    $("askButton").addEventListener("click", () => {
      askConversation(value("followupQuestion"), "");
    });

    document.addEventListener("click", (event) => {
      const feedback = event.target.closest("button[data-feedback-scope]");
      if (feedback) {
        submitFeedback(feedback.dataset.feedbackScope || "", feedback.dataset.feedbackValue || "");
        return;
      }
      const mismatch = event.target.closest("button[data-mismatch]");
      if (mismatch) {
        const probe = (currentRuntime?.probes || [])[0];
        currentMismatchArea = mismatch.dataset.mismatch || "";
        showProbe(`重点校准：${mismatch.dataset.mismatch}`, probe);
        return;
      }
      const probe = event.target.closest("button[data-probe-answer]");
      if (probe) {
        submitProbeAnswer(probe.dataset.probeAnswer || "", probe.dataset.probeId || "").catch((error) => {
          const result = $("probeResult");
          if (result) {
            result.textContent = error.message || "校准暂时没有完成";
            result.classList.add("active");
          }
        });
        return;
      }
      const skip = event.target.closest("button[data-probe-skip]");
      if (skip) {
        $("probeSurface").classList.add("hidden");
        currentMismatchArea = "";
        return;
      }
      const lens = event.target.closest("button[data-lens-action]");
      if (lens) {
        applyLensAction(lens.dataset.lensAction || "", lens.dataset.targetType || "", lens.dataset.targetId || "", lens);
      }
    });
  </script>
</body>
</html>
