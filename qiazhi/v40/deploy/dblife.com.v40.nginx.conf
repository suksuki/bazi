server {
    listen 80;
    server_name dblife.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dblife.com;

    ssl_certificate /etc/letsencrypt/live/dblife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dblife.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 302 /v40/ui;
    }

    location /v40/ {
        proxy_pass http://127.0.0.1:9040/v40/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/v40/ {
        proxy_pass http://127.0.0.1:9040/api/v40/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/v40 {
        proxy_pass http://127.0.0.1:9041/admin/v40;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/v40/ {
        proxy_pass http://127.0.0.1:9041/admin/v40/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /health {
        proxy_pass http://127.0.0.1:9040/api/v40/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 302 /v40/ui;
    }
}
