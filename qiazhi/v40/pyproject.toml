[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiazhi-v40"
version = "40.0.0a0"
description = "Independent Qiazhi V40 evaluation-first multi-engine runtime scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.1",
  "psycopg[binary]==3.3.3",
  "pydantic==2.13.3",
  "redis==7.1.0",
  "uvicorn==0.46.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
include = ["v40*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: explicit integration tests",
  "requires_postgres: requires live V40 Postgres",
  "requires_redis: requires live V40 Redis",
]
