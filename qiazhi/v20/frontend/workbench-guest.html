<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V20 游客测算阅读</title>
    <link rel="icon" href="/v20/ui/favicon.png" />
    <link rel="stylesheet" href="/v20/ui/styles.css?v=20260516-question-narrative" />
  </head>
  <body data-workbench-page="guest" data-workbench-default-mode="reading" data-workbench-lock-mode="true" data-role="guest">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/v20/ui/qiazhi-logo-mark.png" alt="掐指一算" />
          <div>
            <p class="eyebrow">Qiazhi V20</p>
            <h1 data-ui="app_title">游客测算阅读</h1>
          </div>
        </div>
        <nav class="top-actions" aria-label="V20 navigation">
          <a href="/v20/ui/" data-ui="nav_profiles">入口</a>
          <a href="/v20/ui/workbench-guest.html" aria-current="page" data-ui="nav_measure">测算</a>
          <button type="button" id="logoutButton" class="logout-action" data-ui="logout_button" hidden>登出</button>
        </nav>
      </header>

      <main class="measure-layout">
        <form id="measureForm" hidden>
          <input type="hidden" name="input_id" id="inputId" value="" />
          <input type="hidden" name="role_key" id="roleSelect" value="guest" data-session-role="guest" />
          <input type="hidden" name="locale" id="localeSelect" value="zh" />
          <input type="hidden" name="calendar" id="calendarHidden" value="solar" />
          <input type="hidden" name="gender" id="genderHidden" value="male" />
          <input type="hidden" name="lunar_is_leap" id="lunarIsLeapHidden" value="false" />
          <input type="checkbox" id="lunarIsLeapCheckbox" hidden />
          <input type="hidden" name="year" value="" />
          <input type="hidden" name="month" value="" />
          <input type="hidden" name="day" value="" />
          <input type="hidden" name="hour" value="" />
          <input type="hidden" name="minute" value="" />
          <input type="hidden" name="question_id" id="questionId" value="" />
          <input type="hidden" name="user_text" value="" />
          <select name="question_key" id="questionSelect" hidden><option value=""></option></select>
          <input type="hidden" name="flow_year_pillar" value="" />
        </form>

        <section class="result-stage" aria-live="polite">
          <section class="dashboard-grid" data-workbench-section="structure">
            <article class="panel chart-panel">
              <div class="section-head">
                <div>
                  <p class="section-kicker">四柱</p>
                  <h2 data-ui="chart_title">命盘结构</h2>
                </div>
                <span id="dayMasterBadge" class="small-pill">日主</span>
              </div>
              <div id="pillarPanel" class="pillar-panel"></div>
              <div id="tenGodLine" class="tag-line"></div>
            </article>

            <article id="structureDynamicsPanel" class="panel structure-dynamics-panel">
              <div class="section-head">
                <div>
                  <p class="section-kicker">动态</p>
                  <h2>结构动态</h2>
                </div>
                <span id="structureDynamicsStatus" class="small-pill">待测算</span>
              </div>
              <div id="structureDynamicsState" class="dynamic-metric-grid"></div>
              <div id="structureDynamicsInterpretation" class="dynamic-interpretation"></div>
              <div id="structureDynamicsChain" class="dynamic-chain-line"></div>
              <div id="structureDynamicsStructures" class="dynamic-structure-list"></div>
            </article>

          </section>

          <section class="answer-grid" data-workbench-section="answer">
            <article class="panel answer-panel">
              <div class="section-head">
                <div>
                  <p class="section-kicker">回答</p>
                  <h2 data-ui="answer_title">八字专业回复</h2>
                </div>
                <span id="llmStatus" class="small-pill">LLM 待命</span>
              </div>
              <div id="brainStatePanel" class="brain-state-panel">
                <div class="brain-state-head">
                  <span class="small-pill" data-ui="brain_title">中枢</span>
                  <strong id="brainStateHeadline">等待中枢判断。</strong>
                </div>
                <div id="brainStateMeta" class="brain-state-meta"></div>
                <div id="brainStateBasis" class="brain-state-basis"></div>
              </div>
              <div id="roleViewPanel" class="brain-state-panel role-view-panel">
                <div class="brain-state-head">
                  <span class="small-pill">画像</span>
                  <strong id="roleViewTitle">等待角色画像。</strong>
                </div>
                <div id="roleViewPortrait" class="brain-state-basis"></div>
              </div>
              <div id="readingProgressPanel" class="reading-progress-panel">
                <div class="brain-state-head">
                  <span class="small-pill">阅读进度</span>
                  <strong id="readingProgressHeadline">等待八字阅读链路。</strong>
                </div>
                <div id="readingProgressGrid" class="reading-progress-grid"></div>
                <p id="readingProgressNarrative" class="reading-progress-narrative">确认四柱后会生成画像、特征和智能问题。</p>
              </div>
              <div id="contextBindingPanel" class="context-binding-panel">
                <div class="brain-state-head">
                  <span class="small-pill">八字上下文</span>
                  <strong id="contextBindingHeadline">等待当前命盘。</strong>
                </div>
                <div id="contextBindingSummary" class="context-binding-summary"></div>
                <div id="contextBindingModules" class="context-binding-modules"></div>
              </div>
              <pre id="answerText">等待测算。</pre>
              <div id="answerFeedbackPanel" class="answer-feedback-panel" hidden></div>
              <div id="chatTranscript" class="chat-transcript" aria-live="polite"></div>
              <div class="answer-question-strip">
                <div class="section-head">
                  <div>
                    <p class="section-kicker">智能问题</p>
                    <h2 data-ui="questions_title">智能问题</h2>
                  </div>
                  <span id="意图Summary" class="small-pill">意图</span>
                </div>
                <div id="roleQuestionProfile" class="role-question-profile"></div>
                <div id="questionList" class="question-list answer-question-list"></div>
              </div>
              <div class="dialog-row" aria-label="八字对话">
                <textarea id="chatText" rows="3" placeholder="输入想继续看的方向" data-ui-placeholder="chat_ph"></textarea>
                <button type="button" id="chatButton" data-ui="send">发送</button>
              </div>
            </article>

          </section>
        </section>
      </main>
    </div>
    <script src="/v20/ui/workbench_routes.js?v=20260510-mvc-routes"></script>
    <script src="/v20/ui/workbench_page_controller.js?v=20260510-mvc-page-controller"></script>
    <script src="app.js?v=20.3.19-runtime-flow"></script>
  </body>
</html>
