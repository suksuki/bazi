<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V20 八字档案管理</title>
    <link rel="icon" href="/v20/ui/favicon.png" />
    <link rel="stylesheet" href="/v20/ui/styles.css?v=20260505-glass" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/v20/ui/qiazhi-logo-mark.png" alt="掐指一算" />
          <div>
            <p class="eyebrow">Qiazhi V20</p>
            <h1 data-profile-ui="app_title">八字档案管理</h1>
          </div>
        </div>
        <nav class="top-actions" aria-label="V20 navigation">
          <a href="/v20/ui/" data-profile-ui="nav_entry">入口</a>
          <a href="/v20/ui/profiles.html" aria-current="page" data-profile-ui="nav_profiles">档案</a>
          <a href="/v20/ui/workbench.html" data-profile-ui="nav_measure">测算</a>
          <a href="/v20/ui/admin.html" class="admin-nav-link" hidden>Admin</a>
          <button type="button" id="logoutButton" class="logout-action" data-profile-ui="logout_button" hidden>登出</button>
          <span id="profileRuntimeStatus" class="status-pill">checking</span>
        </nav>
      </header>

      <main class="profiles-layout">
        <section class="profile-command-panel">
          <div class="section-head">
            <div>
              <p class="section-kicker">Profiles</p>
              <h2 data-profile-ui="list_title">档案列表</h2>
            </div>
            <span id="profileCount" class="small-pill">0</span>
          </div>
          <div class="profile-command-row">
            <button type="button" id="newProfileButton" class="mini-action" data-profile-ui="new_profile">新增档案</button>
            <input type="hidden" id="profileLocale" value="zh" />
          </div>
          <div id="profileStatus" class="status-line">loading</div>
        </section>

        <section id="profileEditor" class="profile-editor-panel" hidden>
          <div class="section-head">
            <div>
              <p class="section-kicker">Profile Manager</p>
              <h2 id="profileEditorTitle" data-profile-ui="editor_new">新增档案</h2>
            </div>
            <button type="button" id="cancelProfileEdit" class="mini-action secondary" data-profile-ui="cancel">取消</button>
          </div>
          <div class="profile-editor-grid">
            <label><span data-profile-ui="display_name">姓名/标题</span><input id="profileDisplayName" autocomplete="off" /></label>
            <label><span data-profile-ui="gender">性别</span>
              <select id="profileGender">
                <option value="male" data-profile-option="gender_male">男</option>
                <option value="female" data-profile-option="gender_female">女</option>
              </select>
            </label>
            <label><span data-profile-ui="calendar">历法</span>
              <select id="profileCalendar">
                <option value="solar" data-profile-option="calendar_solar">公历</option>
                <option value="lunar" data-profile-option="calendar_lunar">农历</option>
              </select>
            </label>
            <label id="profileLunarLeapMonthRow" class="check-row"><input id="profileLunarLeapMonth" type="checkbox" /><span data-profile-ui="lunar_leap_month">农历闰月</span></label>
            <label><span data-profile-ui="birth_year">出生年</span><select id="profileBirthYear"></select></label>
            <label><span data-profile-ui="birth_month">出生月</span><select id="profileBirthMonth"></select></label>
            <label><span data-profile-ui="birth_day">出生日</span><select id="profileBirthDay"></select></label>
            <label><span data-profile-ui="birth_hour">出生时</span><select id="profileBirthHour"></select></label>
            <label><span data-profile-ui="birth_minute">出生分</span><select id="profileBirthMinute"></select></label>
            <label><span data-profile-ui="profile_status_label">状态</span>
              <select id="profileRecordStatus">
                <option value="active" data-profile-option="status_active">active</option>
                <option value="archived" data-profile-option="status_archived">archived</option>
              </select>
            </label>
          </div>
          <div class="profile-editor-actions">
            <button type="button" id="saveProfileButton" class="mini-action" data-profile-ui="save_profile">保存档案</button>
          </div>
        </section>

        <section id="profileList" class="profile-grid" aria-live="polite"></section>
      </main>
    </div>
    <script src="/v20/ui/profiles.js?v=20260505-defaults" defer></script>
  </body>
</html>
