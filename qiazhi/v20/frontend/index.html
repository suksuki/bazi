<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>掐指一算 V20</title>
    <link rel="icon" href="/v20/ui/favicon.png" />
    <link rel="stylesheet" href="/v20/ui/styles.css?v=20260504-mobile-sync" />
  </head>
  <body>
    <main class="auth-wrapper">
      <div class="auth-container">
        <header class="auth-header">
          <img class="brand-logo" src="/v20/ui/qiazhi-logo-mark.png" alt="Qiazhi" />
          <h1 data-entry="title">进入掐指一算</h1>
          <p data-entry="subtitle">V20 命理测算系统</p>
        </header>

        <nav class="auth-tabs">
          <button type="button" class="tab-btn active" data-tab="guest" data-entry="guest_button">游客进入</button>
          <button type="button" class="tab-btn" data-tab="login" data-entry="login_button">登录</button>
          <button type="button" class="tab-btn" data-tab="register" data-entry="register_button">注册</button>
        </nav>

        <div class="auth-body">
          <!-- Guest Section -->
          <div id="guestPane" class="auth-pane active">
            <div class="pane-content guest-form">
              <p data-entry="guest_desc">输入出生信息直接开启测算</p>
              
              <div class="input-row">
                <select id="guestCalendar">
                  <option value="solar">公历 (Solar)</option>
                  <option value="lunar">农历 (Lunar)</option>
                </select>
                <select id="guestGender">
                  <option value="male">男 (Male)</option>
                  <option value="female">女 (Female)</option>
                </select>
              </div>

              <div class="input-grid-date">
                <input id="guestYear" type="number" placeholder="年" min="1900" max="2100" />
                <input id="guestMonth" type="number" placeholder="月" min="1" max="12" />
                <input id="guestDay" type="number" placeholder="日" min="1" max="31" />
              </div>

              <div class="input-grid-time">
                <input id="guestHour" type="number" placeholder="时" min="0" max="23" />
                <input id="guestMinute" type="number" placeholder="分" min="0" max="59" />
                <select id="guestFlowYear">
                  <!-- Will be populated by JS -->
                </select>
              </div>

              <button type="button" id="guestStart" class="btn-primary">开始测算</button>
            </div>
          </div>

          <!-- Login Section -->
          <div id="loginPane" class="auth-pane">
            <div class="pane-content">
              <div class="input-field">
                <input id="loginName" autocomplete="username" placeholder="用户名" />
              </div>
              <div class="input-field">
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="密码" />
              </div>
              <button type="button" id="loginButton" class="btn-primary">进入系统</button>
            </div>
          </div>

          <!-- Register Section -->
          <div id="registerPane" class="auth-pane">
            <div class="pane-content">
              <div class="input-field">
                <input id="registerName" autocomplete="username" placeholder="新用户名" />
              </div>
              <div class="input-field">
                <input id="registerPassword" type="password" autocomplete="new-password" placeholder="新密码" />
              </div>
              <div class="input-field">
                <select id="registerRole">
                  <option value="user" data-entry-option="role_user">普通用户</option>
                  <option value="analyst" data-entry-option="role_practitioner">命理师</option>
                </select>
              </div>
              <button type="button" id="registerButton" class="btn-primary">创建账号</button>
            </div>
          </div>
        </div>

        <footer class="auth-footer">
          <div id="entryStatus" class="status-msg"></div>
          <select id="entryLocale" class="minimal-select">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
          </select>
        </footer>
      </div>
    </main>
    <script src="/v20/ui/entry.js?v=20260504-mobile-sync" defer></script>
  </body>
</html>
