<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>掐指一算 V20</title>
    <link rel="stylesheet" href="/v20/ui/styles.css" />
  </head>
  <body>
    <main class="entry-page">
      <header class="entry-hero">
        <div class="brand compact-brand">
          <div class="brand-mark large">掐</div>
          <div>
            <p class="eyebrow">Qiazhi V20</p>
            <h1 data-entry="title">进入掐指一算</h1>
            <p data-entry="subtitle">选择游客、命理师或 Admin 入口，进入 V20 命理测算系统。</p>
          </div>
        </div>
        <label class="locale-switch">
          <span data-entry="language">语言</span>
          <select id="entryLocale">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
          </select>
        </label>
      </header>

      <section class="entry-grid">
        <article class="entry-card primary-entry">
          <p class="section-kicker">Fast start</p>
          <h2 data-entry="guest_title">游客即时测算</h2>
          <p data-entry="guest_desc">不需要账号，直接进入测算台。适合快速体验和临时问盘。</p>
          <button type="button" id="guestStart" data-entry="guest_button">游客进入</button>
        </article>

        <article class="entry-card">
          <p class="section-kicker">Account</p>
          <h2 data-entry="login_title">本地账号登录</h2>
          <p data-entry="login_desc">用于保留多用户、命理师工作流和后续用户档案。</p>
          <div class="entry-form">
            <label><span data-entry="username">用户名</span><input id="loginName" autocomplete="username" placeholder="local_user" /></label>
            <label><span data-entry="password">密码</span><input id="loginPassword" type="password" autocomplete="current-password" /></label>
            <label><span data-entry="role">角色</span>
              <select id="loginRole">
                <option value="user" data-entry-option="role_guest">游客</option>
                <option value="analyst" data-entry-option="role_practitioner">命理师</option>
                <option value="admin">Admin</option>
              </select>
            </label>
          </div>
          <div class="button-row">
            <button type="button" id="loginButton" data-entry="login_button">登录</button>
            <button type="button" id="registerButton" class="secondary" data-entry="register_button">注册</button>
          </div>
        </article>

        <article class="entry-card">
          <p class="section-kicker">Admin</p>
          <h2>DB / LLM</h2>
          <p data-entry="admin_desc">Admin 页面只保留数据库与 LLM 运行状态，复杂知识和规则治理不放在入口页。</p>
          <a class="entry-link" href="/v20/ui/admin.html">Admin</a>
          <a class="entry-link subtle" href="/v20/ui/profiles.html" data-entry="profiles_link">档案管理</a>
        </article>
      </section>

      <div id="entryStatus" class="status-line">checking</div>
    </main>
    <script src="/v20/ui/entry.js" defer></script>
  </body>
</html>
