<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V20 测算入口</title>
    <link rel="icon" href="/v20/ui/favicon.png" />
    <link rel="stylesheet" href="/v20/ui/styles.css?v=20260510-ui-clean" />
  </head>
  <body data-workbench-page="auto">
    <main class="entry-page">
      <div class="auth-shell compact">
        <img class="brand-logo" src="/v20/ui/qiazhi-logo-mark.png" alt="掐指一算" />
        <p class="eyebrow">Qiazhi V20</p>
        <h1>正在进入测算台</h1>
        <p id="redirectStatus" class="status-msg">根据当前账号权限选择页面。</p>
      </div>
    </main>
    <script src="/v20/ui/workbench_routes.js?v=20260510-mvc-routes"></script>
    <script>
      (function routeLegacyWorkbench() {
        const routes = window.QiazhiWorkbenchRoutes;
        const status = document.querySelector("#redirectStatus");
        const redirectTo = (role) => {
          const target = routes.pageForRole(role || "user");
          window.location.replace(`${target}${window.location.search}`);
        };

        fetch("/api/v20/auth/me")
          .then((response) => response.json())
          .then((payload) => {
            const session = payload.session || {};
            const isGuest = session.username === "guest" || String(session.user_id || "").startsWith("guest_");
            redirectTo(isGuest ? "guest" : payload.authenticated ? session.role : "user");
          })
          .catch(() => {
            if (status) status.textContent = "无法读取登录状态，进入普通用户页面。";
            redirectTo("user");
          });
      })();
    </script>
  </body>
</html>
