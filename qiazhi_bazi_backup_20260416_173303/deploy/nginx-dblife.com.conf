server {
    listen 80;
    server_name dblife.com;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 静态资源单独走前缀匹配，避免与通用反代规则组合时出现异常响应（如 400）
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 禁止把浏览器/CDN 里的 Vercel/边缘专用头转给自建 next start，否则可能误走 minimalMode 路由并 DecodeError→400
        proxy_set_header X-Matched-Path "";
        proxy_set_header X-Nextjs-Data "";
        proxy_set_header X-Invoke-Path "";
        proxy_set_header X-Now-Route-Matches "";
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Matched-Path "";
        proxy_set_header X-Nextjs-Data "";
        proxy_set_header X-Invoke-Path "";
        proxy_set_header X-Now-Route-Matches "";
        proxy_redirect off;
    }
}
