# 二选一（不要对 /api 既交给 Next 又在 Nginx 直连 uvicorn，会冲突）
#
# ── 方案 A（推荐）：/api 由 Nginx 直连 FastAPI，Next 只负责页面 ───────────────
#   前端构建勿再写 NEXT_PUBLIC_QIAZHI_API=http://127.0.0.1:8001；可留空或 https://dblife.com
#   浏览器请求 https://dblife.com/api/... → 本 server 的 location /api/
#
# ── 方案 B：全部流量进 Next（:3001），由 next.config rewrites 转发 /api → 8001 ─
#   删除或注释下述整段 location /api/，只保留 location / → next

upstream qiazhi_fastapi {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name dblife.com www.dblife.com;

    # ssl_certificate / ssl_certificate_key ...

    # 顺序：先精确前缀，避免其它 location 误伤
    location /api/ {
        proxy_pass http://qiazhi_fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 显式把 Next 静态资源指到 Node（若 chunk 在域名下 500 而本机 3001 正常，多半是外层 Nginx 把 /_next 指错了）
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
